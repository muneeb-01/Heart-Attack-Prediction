version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cardio_ai_service
    ports:
      - "5000:5000"
    volumes:
      # Exclude venv and egg-info from container mounting to prevent host/container dependency conflicts
      - .:/app
      - /app/venv
      - /app/Heart_Disease_Prediction.egg-info
    environment:
      - FLASK_ENV=development
      - PORT=5000
    restart: unless-stopped
